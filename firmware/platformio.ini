; Joust firmware v2
; Board: https://docs.platformio.org/en/latest/boards/atmelavr/megaatmega2560.html
; Decisions: ../docs/decisions.md

[platformio]
default_envs = joust

; Shared by both Mega envs, so board settings live in one place
[mega]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit Motor Shield V2 Library@1.1.4
; Warnings for project code only; the Arduino core is not warning-clean
build_src_flags = -Wall -Wextra
; Serial port is auto-detected. Set upload_port only with 2+ boards plugged in.

; Live show firmware
[env:joust]
extends = mega
build_src_filter = +<joust/>

; Bench: jog, switch watch, calibration. Motion code in lib/motion is shared with joust.
[env:bench]
extends = mega
build_src_filter = +<bench/>

; Host unit tests for lib/motion. Run: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror
