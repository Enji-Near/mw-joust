<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <style>
      .box{fill:#fff;stroke:#333;stroke-width:1.6}
      .fut{fill:#fafafa;stroke:#999;stroke-width:1.4;stroke-dasharray:7 5}
      .p12{stroke:#c62828;stroke-width:3.5;fill:none}
      .p12s{stroke:#ef6c00;stroke-width:3.5;fill:none}
      .gnd{stroke:#222;stroke-width:2.2;fill:none}
      .sig{stroke:#1565c0;stroke-width:1.8;fill:none}
      .i2c{stroke:#2e7d32;stroke-width:2.2;fill:none}
      .usb{stroke:#6a1b9a;stroke-width:2.2;fill:none}
      .futl{stroke:#999;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
      .t{font-weight:bold;font-size:14px}
      .s{font-size:11.5px;fill:#444}
      .tbd{font-size:11.5px;fill:#b00020;font-weight:bold}
      .h{font-size:22px;font-weight:bold}
    </style>
  </defs>
  <rect width="1400" height="940" fill="#fff"/>
  <text x="24" y="36" class="h">Joust v2 - wiring block diagram</text>
  <text x="24" y="58" class="s">Draft 0.1, 2026-11-08. Pins: firmware/include/config.h. Full schematic: kicad/joust-v2.kicad_sch. TBD (red) = owner to confirm.</text>

  <!-- ===== power chain ===== -->
  <rect x="24" y="90" width="130" height="64" class="box"/>
  <text x="34" y="114" class="t">12 V PSU</text><text x="34" y="132" class="s">single supply</text><text x="34" y="147" class="tbd">rating TBD</text>

  <rect x="200" y="96" width="110" height="52" class="box"/>
  <text x="210" y="118" class="t">Fuse F1</text><text x="210" y="136" class="s">3 A time-lag</text>

  <rect x="350" y="86" width="150" height="72" class="box"/>
  <text x="360" y="108" class="t">Supply caps</text><text x="360" y="126" class="s">C1 330 uF 35 V low-ESR</text><text x="360" y="141" class="s">C2 100 nF ceramic</text>

  <rect x="540" y="86" width="170" height="72" class="box"/>
  <text x="550" y="108" class="t">Motor-power relay K1</text><text x="550" y="126" class="s">COM -&gt; NO, OFF if D22 floats</text><text x="550" y="141" class="tbd">mount + input polarity TBD</text>

  <path d="M154,122 H200" class="p12" marker-end="url(#a)"/>
  <path d="M310,122 H350" class="p12" marker-end="url(#a)"/>
  <path d="M500,122 H540" class="p12" marker-end="url(#a)"/>
  <text x="208" y="172" class="s" fill="#c62828">+12V_FUSED (always live)</text>

  <!-- switched 12 V bus -->
  <path d="M710,122 H760 V200 M120,200 H1000" class="p12s"/>
  <text x="768" y="160" class="s" fill="#ef6c00">+12V_SW (switched)</text>
  <path d="M190,200 V250" class="p12s" marker-end="url(#a)"/>
  <path d="M530,200 V250" class="p12s" marker-end="url(#a)"/>
  <path d="M930,200 V250" class="p12s" marker-end="url(#a)"/>

  <!-- shield -->
  <rect x="60" y="250" width="290" height="150" class="box"/>
  <text x="72" y="274" class="t">Adafruit Motor Shield V2 (U2)</text>
  <text x="72" y="292" class="s">stacked on the Mega, I2C 0x60, Vin jumper OFF</text>
  <text x="72" y="310" class="s">C3 100 uF 35 V + C4 100 nF at motor terminal</text>
  <text x="72" y="334" class="s">M1 K1 lance (down = FORWARD)</text>
  <text x="72" y="350" class="s">M2 K1 rotate (CW = BACKWARD)</text>
  <text x="72" y="366" class="s">M3 K2 lance (down = FORWARD)</text>
  <text x="72" y="382" class="s">M4 K2 rotate (CW = BACKWARD)</text>

  <!-- chain today -->
  <rect x="420" y="250" width="220" height="78" class="box"/>
  <text x="430" y="274" class="t">Chain relay board K2 (today)</text>
  <text x="430" y="292" class="s">A0 CCW, A1 CW, active LOW</text>
  <text x="430" y="310" class="tbd">contact wiring, brake/coast TBD</text>

  <!-- DRV8871 -->
  <rect x="820" y="250" width="240" height="78" class="fut"/>
  <text x="832" y="274" class="t">DRV8871 U3 (Task 9, replaces K2)</text>
  <text x="832" y="292" class="s">IN1 D44, IN2 D45; ~2.1 A limit</text>
  <text x="832" y="310" class="s">C9 100 uF 35 V + C10 100 nF at VM</text>

  <!-- motors -->
  <g>
    <rect x="60" y="440" width="290" height="62" class="box"/>
    <text x="72" y="462" class="t">4 knight motors, 12 V DC</text>
    <text x="72" y="480" class="s">C5-C8 100 nF ceramic across each motor</text>
    <text x="72" y="495" class="s">leads twisted; NEVER an electrolytic</text>
    <path d="M205,400 V440" class="p12s" marker-end="url(#a)"/>
  </g>
  <rect x="820" y="390" width="200" height="62" class="box"/>
  <text x="830" y="412" class="t">Chain motor, 12 V DC</text>
  <text x="830" y="430" class="s">C11 100 nF across terminals</text>
  <text x="830" y="445" class="s">K2 today, U3 later (one only)</text>
  <path d="M640,315 H770 V420 H820" class="p12s" marker-end="url(#a)"/>
  <path d="M940,328 V390" class="p12s" stroke-dasharray="7 5" marker-end="url(#a)"/>

  <!-- ===== Mega ===== -->
  <rect x="440" y="520" width="330" height="270" class="box"/>
  <text x="452" y="544" class="t">Arduino Mega 2560 R3 (U1)</text>
  <text x="452" y="562" class="s">powered and programmed over USB (serial 115200)</text>
  <text x="452" y="590" class="s">D2 start  D3-D12 limits  A9 key  A12 safe-op</text>
  <text x="452" y="606" class="s">A2 A3 A10 A11 panel  D23 D24 panel (tentative)</text>
  <text x="452" y="630" class="s">D13 start LED  D22 motor-power relay</text>
  <text x="452" y="646" class="s">A0 A1 chain relays  D44 D45 DRV8871</text>
  <text x="452" y="662" class="s">D20 SDA  D21 SCL (to shield via R3 header)</text>
  <text x="452" y="678" class="s">D18 TX1  D19 RX1 (future ESP32)</text>
  <text x="452" y="704" class="s">Reserved: D0/D1, D18-D21, D44-D46 (Timer5), D50-D53</text>
  <text x="452" y="720" class="tbd">A4/A5 tie to SDA/SCL on shield? (check)</text>

  <rect x="230" y="560" width="150" height="50" class="box"/>
  <text x="242" y="582" class="t">USB host / PSU</text><text x="242" y="598" class="s">5 V for Mega + logic</text>
  <path d="M380,585 H440" class="usb" marker-end="url(#a)"/>

  <!-- I2C to shield -->
  <path d="M470,520 V420 H330 V400" class="i2c" marker-end="url(#a)"/>
  <text x="360" y="414" class="s" fill="#2e7d32">I2C SDA/SCL + 5 V logic</text>
  <!-- relay control -->
  <path d="M690,520 V160" class="sig" marker-end="url(#a)"/>
  <text x="696" y="180" class="s" fill="#1565c0">D22</text>
  <path d="M600,520 V328" class="sig" marker-end="url(#a)"/>
  <text x="566" y="352" class="s" fill="#1565c0"></text>
  <text x="604" y="512" class="s" fill="#1565c0">A0/A1</text>
  <path d="M740,520 V470 H795 V290 H820" class="sig" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="742" y="465" class="s" fill="#1565c0">D44/D45</text>

  <!-- ===== inputs ===== -->
  <rect x="1060" y="400" width="310" height="150" class="box"/>
  <text x="1072" y="424" class="t">Limit input filter board (x10)</text>
  <text x="1072" y="442" class="s">per switch: 1k pull-up to 5 V, 1k series,</text>
  <text x="1072" y="457" class="s">100 nF to GND at the Mega pin</text>
  <text x="1072" y="475" class="s">R11-R30, C12-C21 on protoboard near the Mega</text>
  <text x="1072" y="493" class="s">D3 K1 lance dn [B']   D4 K2 lance dn [B]</text>
  <text x="1072" y="508" class="s">D5 chain CCW [A]   D6 chain CW [A']</text>
  <text x="1072" y="523" class="s">D7 K1 lance up [C']   D8 K2 lance up [C]</text>
  <text x="1072" y="538" class="s">D9/D10 rot CCW [D'/D]   D11/D12 rot CW [E'/E]</text>

  <rect x="1100" y="250" width="270" height="100" class="box"/>
  <text x="1112" y="274" class="t">10 limit switches</text>
  <text x="1112" y="292" class="s">lance: bolt on axle touches post on small</text>
  <text x="1112" y="307" class="s">PCB; bolt grounded through a brush</text>
  <text x="1112" y="325" class="s">all active LOW (closed = to GND)</text>
  <path d="M1235,350 V400" class="sig" marker-end="url(#a)"/>
  <path d="M1060,500 H770" class="sig" marker-end="url(#a)"/>
  <text x="900" y="492" class="s" fill="#1565c0">D3-D12</text>

  <rect x="1060" y="600" width="310" height="150" class="box"/>
  <text x="1072" y="624" class="t">Operator inputs + indicator</text>
  <text x="1072" y="642" class="s">internal pull-ups, switch to GND</text>
  <text x="1072" y="660" class="s">D2 start button   A9 key switch</text>
  <text x="1072" y="676" class="s">A12 safe-op jumper</text>
  <text x="1072" y="692" class="s">Panel: A2/A3 rotate CW/CCW, A10/A11 chain CW/CCW</text>
  <text x="1072" y="708" class="s">D23/D24 lances up/down (tentative, was A4/A5)</text>
  <text x="1072" y="724" class="s">D13 -&gt; MOSFET Q1 -&gt; 12 V button LED (+12V_FUSED)</text>
  <text x="1072" y="740" class="tbd">Q1 part no. and panel location TBD</text>
  <path d="M1060,670 H770" class="sig" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- ===== future ESP32 ===== -->
  <rect x="440" y="830" width="330" height="70" class="fut"/>
  <text x="452" y="852" class="t" fill="#777">Future (S1): ESP32 via level shifter</text>
  <text x="452" y="870" class="s">D18 TX1 -&gt; ESP32 RX, ESP32 TX -&gt; D19 RX1</text>
  <text x="452" y="886" class="s">ESP32 is 3.3 V: 5 V into it is over rating</text>
  <path d="M605,790 V830" class="futl"/>

  <!-- ground -->
  <rect x="60" y="680" width="300" height="100" class="box"/>
  <text x="72" y="704" class="t">Star ground (one point)</text>
  <text x="72" y="722" class="s">PSU -, shield GND, DRV8871 GND,</text>
  <text x="72" y="738" class="s">chain relay GND, Mega GND, filter board GND</text>
  <text x="72" y="756" class="s">DRV8871 inputs referenced to Mega GND</text>
  <path d="M360,730 H440" class="gnd"/>

  <!-- legend -->
  <g transform="translate(1060,800)">
    <text x="0" y="0" class="t">Legend</text>
    <path d="M0,18 H40" class="p12"/><text x="50" y="22" class="s">12 V fused (always live)</text>
    <path d="M0,38 H40" class="p12s"/><text x="50" y="42" class="s">12 V switched by K1</text>
    <path d="M0,58 H40" class="sig"/><text x="50" y="62" class="s">signal (5 V logic)</text>
    <path d="M0,78 H40" class="i2c"/><text x="50" y="82" class="s">I2C</text>
    <path d="M160,78 H200" class="gnd"/><text x="210" y="82" class="s">ground</text>
    <path d="M0,98 H40" class="futl"/><text x="50" y="102" class="s">planned / future</text>
  </g>
</svg>
