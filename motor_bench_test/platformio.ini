; Joust retrofit: motor endurance bench test
; Board settings: https://docs.platformio.org/en/latest/boards/atmelmegaavr/nano_every.html
[env:motor_bench_test]
platform = atmelmegaavr
board = nano_every
framework = arduino
monitor_speed = 115200
; Serial port is auto-detected. Set upload_port only with 2+ boards plugged in.
